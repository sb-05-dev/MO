<div class="flex h-screen bg-gray-100">
  <div class="w-1/4 bg-gray-200 shadow-md p-6 overflow-hidden">
    <h2 class="text-lg font-semibold mb-4">Menu</h2>
    <ul class="space-y-4">
      <li>
        <button (click)="setActiveSection('profile')" 
                [class.font-bold]="activeSection === 'profile'"
                class="text-blue-500">
          My Profile
        </button>
      </li>
      <li (click)="setActiveSection('delete')" 
          [class.font-bold]="activeSection === 'delete'"
          class="text-red-500">
        <button class="text-red-500" (click)="onDeleteAccount()">
          <i class="fas fa-trash mr-2"></i> Supprimer
        </button>
      </li>
    </ul>
  </div>

  <div class="flex-1 bg-white p-8 overflow-y-auto">
    <div *ngIf="activeSection === 'profile'">
      <h2 class="text-xl font-semibold mb-4">My Profile</h2>
      
      <img class="w-16 h-16 rounded-full mr-4" [src]="profileForm.get('imgUrl')?.value" alt="Profile picture" />
      <div>
        <h2 class="text-xl font-semibold">{{ profileForm.get('fullName')?.value }}</h2>
        <p class="text-gray-600">{{ profileForm.get('bio')?.value || 'aucune bio' }}</p>
      </div>

      <div class="flex justify-end mb-4">
        <button 
          (click)="toggleEdit()" 
          class="flex items-center bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition duration-300 ease-in-out mr-2">
          <i class="fa-solid" [ngClass]="isEditing ? 'fa-regular fa-floppy-disk' : 'fa-solid fa-pencil'" class="mr-2"></i>
          {{ isEditing ? 'Save' : 'Modifier' }}
        </button>
      
        <!-- Bouton Annuler -->
        <button 
          *ngIf="isEditing" 
          (click)="onCancel()" 
          class="flex items-center bg-gray-300 text-black px-4 py-2 rounded hover:bg-gray-400 transition duration-300 ease-in-out">
          <i class="fa-solid fa-ban mr-2"></i>
          Annuler
        </button>
      </div>
      

      <form [formGroup]="profileForm" (ngSubmit)="onSaveProfile()" [ngClass]="{'pointer-events-none': !isEditing}">
        <div class="grid grid-cols-2 gap-4 bg-gray-100 p-6 rounded-lg shadow-md">
          <div>
            <label class="text-gray-600">Full Name:</label>
            <input type="text" formControlName="fullName" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Email:</label>
            <input type="email" formControlName="email" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Password:</label>
            <input type="password" formControlName="password" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Phone Number:</label>
            <input type="text" formControlName="telephone" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Age:</label>
            <input type="text" formControlName="age" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Image URL:</label>
            <input type="text" formControlName="imgUrl" class="w-full border rounded px-3 py-2" />
          </div>

          <div>
            <label class="text-gray-600">Badge:</label>
            <input type="text" formControlName="badge" class="w-full border rounded px-3 py-2 bg-gray-200" readonly />
          </div>

          <div>
            <label class="text-gray-600">Roles:</label>
            <input type="text" [value]="profileForm.get('roles')?.value.join(', ')" class="w-full border rounded px-3 py-2 bg-gray-200" readonly />
          </div>

          <div class="col-span-2">
            <label class="text-gray-600">Bio:</label>
            <textarea formControlName="bio" class="w-full border rounded px-3 py-2" rows="3"></textarea>
          </div>
        </div>

        <h3 class="col-span-2 text-lg font-semibold mt-6 mb-4">Address</h3>
        <div class="grid grid-cols-2 gap-4 bg-gray-200 p-6 rounded-lg shadow-md">
          <div>
            <label class="text-gray-600">Street:</label>
            <input type="text" formControlName="street" class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="text-gray-600">City:</label>
            <input type="text" formControlName="city" class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="text-gray-600">Postal Code:</label>
            <input type="text" formControlName="postalCode" class="w-full border rounded px-3 py-2" />
          </div>
          <div>
            <label class="text-gray-600">Country:</label>
            <input type="text" formControlName="country" class="w-full border rounded px-3 py-2" />
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
